<script id="orglite-store" type="application/json">{"v": 2, "savedAt": 0, "title": "OrgLite", "markup": "\n\u003Cdiv id=\"app\"\u003E\n  \u003C!-- ============ HEADER ============ --\u003E\n  \u003Cheader\u003E\n    \u003Cdiv class=\"brand\"\u003E\u003Cspan class=\"logo\"\u003E◫\u003C/span\u003EOrgLite\u003Csmall\u003Esingle-file org notes · no Emacs\u003C/small\u003E\u003C/div\u003E\n    \u003Cdiv class=\"spacer\"\u003E\u003C/div\u003E\n    \u003Cbutton class=\"hbtn primary\" id=\"btnSave\" title=\"Save everything into this single HTML file (Ctrl+S)\"\u003E💾 Save\u003C/button\u003E\n    \u003Cbutton class=\"hbtn\" id=\"btnNew\" title=\"Create a new .org file\"\u003E＋ New\u003C/button\u003E\n    \u003Cbutton class=\"hbtn\" id=\"btnLoad\" title=\"Import an .org file from disk\"\u003E📂 Load .org\u003C/button\u003E\n    \u003Cinput type=\"file\" id=\"fileInput\" accept=\".org,.txt,.md,text/plain\" style=\"display:none\"\u003E\n    \u003Cbutton class=\"hbtn\" id=\"btnStress\" title=\"Generate a 100,000-line stress file to test performance\"\u003E⚡ Stress 100k\u003C/button\u003E\n    \u003Cbutton class=\"hbtn\" id=\"btnDownload\" title=\"Download the current file (Ctrl+S)\"\u003E⬇ Save .org\u003C/button\u003E\n    \u003Cbutton class=\"hbtn\" id=\"btnUndo\" disabled title=\"Undo last refile / checkbox action\"\u003E↩ Undo\u003C/button\u003E\n    \u003Cselect id=\"themeSel\" title=\"Theme\"\u003E\n      \u003Coption value=\"dark\"\u003ETheme: Dark\u003C/option\u003E\n      \u003Coption value=\"light\"\u003ETheme: Light\u003C/option\u003E\n      \u003Coption value=\"solarized\"\u003ETheme: Solarized\u003C/option\u003E\n      \u003Coption value=\"nord\"\u003ETheme: Nord\u003C/option\u003E\n      \u003Coption value=\"gruvbox\"\u003ETheme: Gruvbox\u003C/option\u003E\n      \u003Coption value=\"dracula\"\u003ETheme: Dracula\u003C/option\u003E\n      \u003Coption value=\"one-dark\"\u003ETheme: One Dark\u003C/option\u003E\n      \u003Coption value=\"tokyonight\"\u003ETheme: Tokyo Night\u003C/option\u003E\n      \u003Coption value=\"monokai\"\u003ETheme: Monokai\u003C/option\u003E\n    \u003C/select\u003E\n    \u003Cbutton class=\"hbtn\" id=\"btnHelp\" title=\"What is this?\"\u003E?\u003C/button\u003E\n  \u003C/header\u003E\n\n  \u003C!-- ============ BODY ============ --\u003E\n  \u003Cdiv id=\"main\"\u003E\n    \u003C!-- sidebar --\u003E\n    \u003Caside id=\"sidebar\"\u003E\n      \u003Cdiv class=\"sb-tabs\"\u003E\n        \u003Cbutton class=\"sb-tab active\" data-panel=\"pFiles\"\u003EFiles\u003C/button\u003E\n        \u003Cbutton class=\"sb-tab\" data-panel=\"pSearch\"\u003ESearch\u003C/button\u003E\n        \u003Cbutton class=\"sb-tab\" data-panel=\"pLinks\"\u003EBacklinks\u003C/button\u003E\n        \u003Cbutton class=\"sb-tab\" data-panel=\"pGraph\"\u003EGraph\u003C/button\u003E\n      \u003C/div\u003E\n      \u003Cdiv class=\"sb-panel active\" id=\"pFiles\"\u003E\n        \u003Cdiv id=\"filesList\"\u003E\u003C/div\u003E\n        \u003Cdiv class=\"foot-note\"\u003ETiddlyWiki-style: the app \u003Ci\u003Eand\u003C/i\u003E your notes live inside this one HTML file. Press \u003Cb\u003E💾 Save\u003C/b\u003E (Ctrl+S) to write changes back into the file — Chrome/Edge save in place, other browsers download an updated copy to replace the old file. Use \u003Cb\u003ELoad .org\u003C/b\u003E / \u003Cb\u003ESave .org\u003C/b\u003E to exchange individual notes with Emacs or other tools.\u003C/div\u003E\n      \u003C/div\u003E\n      \u003Cdiv class=\"sb-panel\" id=\"pSearch\"\u003E\n        \u003Cdiv class=\"search-row\"\u003E\u003Cinput id=\"searchInput\" placeholder=\"Search all files…\" spellcheck=\"false\"\u003E\u003C/div\u003E\n        \u003Cdiv id=\"searchResults\"\u003E\u003C/div\u003E\n      \u003C/div\u003E\n      \u003Cdiv class=\"sb-panel\" id=\"pLinks\"\u003E\n        \u003Cdiv id=\"linksList\"\u003E\u003Cdiv class=\"empty-note\"\u003ESelect a heading to see what links to it.\u003C/div\u003E\u003C/div\u003E\n      \u003C/div\u003E\n      \u003Cdiv class=\"sb-panel\" id=\"pGraph\"\u003E\n        \u003Cdiv style=\"display:flex;gap:6px;margin-bottom:6px\"\u003E\u003Cbutton class=\"hbtn\" id=\"btnGraphRefresh\" style=\"font-size:11px;padding:3px 9px\"\u003E↻ Rebuild graph\u003C/button\u003E\u003C/div\u003E\n        \u003Csvg id=\"graphSvg\"\u003E\u003C/svg\u003E\n        \u003Cdiv class=\"graph-legend\"\u003ENodes = headings with :ID: or links. Colors = files. Click a node to jump to it.\u003C/div\u003E\n      \u003C/div\u003E\n    \u003C/aside\u003E\n\n    \u003C!-- main column --\u003E\n    \u003Cdiv id=\"mainCol\"\u003E\n      \u003Cdiv class=\"main-toolbar\"\u003E\n        \u003Cdiv class=\"fname\" id=\"fname\"\u003E—\u003C/div\u003E\n        \u003Cdiv class=\"tb-spacer\"\u003E\u003C/div\u003E\n        \u003Cbutton class=\"hbtn\" id=\"btnRefileCur\" title=\"Refile the heading under the cursor (or press R)\"\u003E⤵ Refile\u003C/button\u003E\n        \u003Cbutton class=\"hbtn\" id=\"btnFoldAll\" style=\"font-size:11.5px;padding:3px 9px\"\u003EFold all\u003C/button\u003E\n        \u003Cbutton class=\"hbtn\" id=\"btnUnfoldAll\" style=\"font-size:11.5px;padding:3px 9px\"\u003EUnfold all\u003C/button\u003E\n        \u003Cbutton class=\"hbtn\" id=\"btnFocusPane\" title=\"Toggle the preview pane (or press z)\"\u003E◫ Preview\u003C/button\u003E\n      \u003C/div\u003E\n      \u003Cdiv id=\"contentWrap\" class=\"focus\"\u003E\n        \u003Cdiv id=\"bufferWrap\"\u003E\n          \u003Cdiv id=\"bufferViewport\"\u003E\u003Cdiv id=\"bufferRows\"\u003E\u003C/div\u003E\u003C/div\u003E\n          \u003Cdiv id=\"bufferSearch\" class=\"hidden\"\u003E\u003Cspan class=\"srk\"\u003E/\u003C/span\u003E\u003Cinput id=\"bufferSearchInput\" placeholder=\"search buffer…\" spellcheck=\"false\"\u003E\u003Cspan id=\"bufferSearchInfo\"\u003E\u003C/span\u003E\u003C/div\u003E\n        \u003C/div\u003E\n        \u003Cdiv id=\"paneHandle\" title=\"Drag to resize the preview pane\"\u003E\u003C/div\u003E\n        \u003Cdiv id=\"focusPane\"\u003E\n          \u003Cdiv id=\"focusScroll\"\u003E\n            \u003Cdiv class=\"fp-crumb\" id=\"fpCrumb\"\u003E\u003C/div\u003E\n            \u003Cdiv class=\"fp-title\" id=\"fpTitle\"\u003E\u003C/div\u003E\n            \u003Cdiv id=\"fpTags\"\u003E\u003C/div\u003E\n            \u003Cdiv class=\"fp-meta\" id=\"fpMeta\"\u003E\u003C/div\u003E\n            \u003Cdiv class=\"fp-actions\"\u003E\n              \u003Cbutton id=\"fpRefile\" title=\"Move this subtree to another file or heading — links survive because :ID: is preserved\"\u003E⤵ Refile…\u003C/button\u003E\n              \u003Cbutton id=\"fpCopyId\" title=\"Copy this heading's :ID: to the clipboard\"\u003E⧉ Copy ID\u003C/button\u003E\n              \u003Cbutton id=\"fpJump\" title=\"Move the cursor to this heading in the buffer\"\u003E↳ Jump in buffer\u003C/button\u003E\n            \u003C/div\u003E\n            \u003Cdiv id=\"fpBody\"\u003E\u003C/div\u003E\n          \u003C/div\u003E\n        \u003C/div\u003E\n      \u003C/div\u003E\n    \u003C/div\u003E\n  \u003C/div\u003E\n\n  \u003C!-- ============ STATUS BAR ============ --\u003E\n  \u003Cdiv id=\"statusBar\"\u003E\n    \u003Cspan id=\"stMode\" class=\"normal\"\u003ENORMAL\u003C/span\u003E\n    \u003Cspan id=\"stSaved\"\u003E💾 saved\u003C/span\u003E\n    \u003Cspan id=\"stFile\"\u003E—\u003C/span\u003E\u003Cspan class=\"sp\"\u003E\u003C/span\u003E\n    \u003Cspan id=\"stPerf\" class=\"perf\"\u003E\u003C/span\u003E\n    \u003Cspan id=\"stStats\"\u003E\u003C/span\u003E\n  \u003C/div\u003E\n\u003C/div\u003E\n\n\u003C!-- ============ REFILE MODAL ============ --\u003E\n\u003Cdiv class=\"overlay\" id=\"rfModal\"\u003E\n  \u003Cdiv class=\"modal\"\u003E\n    \u003Ch3\u003E⤵ Refile subtree\u003C/h3\u003E\n    \u003Cdiv class=\"mbody\"\u003E\n      \u003Cdiv class=\"mrow\"\u003E\u003Clabel\u003ESource\u003C/label\u003E\u003Cdiv id=\"rfSource\" style=\"font-size:12.5px;padding:6px 9px;background:var(--panel2);border:1px solid var(--border);border-radius:7px\"\u003E\u003C/div\u003E\u003C/div\u003E\n      \u003Cdiv class=\"mrow\"\u003E\u003Clabel\u003EDestination file\u003C/label\u003E\u003Cselect id=\"rfFile\"\u003E\u003C/select\u003E\u003C/div\u003E\n      \u003Cdiv class=\"mrow\"\u003E\u003Clabel\u003EDestination heading\u003C/label\u003E\u003Cselect id=\"rfTarget\"\u003E\u003C/select\u003E\u003C/div\u003E\n      \u003Cdiv class=\"mrow\"\u003E\u003Clabel\u003EPlacement\u003C/label\u003E\n        \u003Cdiv class=\"radio\"\u003E\n          \u003Clabel\u003E\u003Cinput type=\"radio\" name=\"rfmode\" value=\"child\" checked\u003E as child of target\u003C/label\u003E\n          \u003Clabel\u003E\u003Cinput type=\"radio\" name=\"rfmode\" value=\"after\"\u003E as sibling after target\u003C/label\u003E\n        \u003C/div\u003E\n      \u003C/div\u003E\n      \u003Cdiv class=\"empty-note\" style=\"font-size:11.5px\"\u003EThe subtree keeps its \u003Ccode\u003E:ID:\u003C/code\u003E, so \u003Ccode\u003E[[id:…]]\u003C/code\u003E backlinks across files keep resolving after the move — org-roam's core trick.\u003C/div\u003E\n    \u003C/div\u003E\n    \u003Cdiv class=\"mfoot\"\u003E\n      \u003Cbutton class=\"hbtn\" id=\"rfCancel\"\u003ECancel\u003C/button\u003E\n      \u003Cbutton class=\"hbtn primary\" id=\"rfConfirm\"\u003ERefile\u003C/button\u003E\n    \u003C/div\u003E\n  \u003C/div\u003E\n\u003C/div\u003E\n\n\u003C!-- ============ HELP MODAL ============ --\u003E\n\u003Cdiv class=\"overlay\" id=\"helpModal\"\u003E\n  \u003Cdiv class=\"modal\"\u003E\n    \u003Ch3\u003E◫ OrgLite — prototype\u003C/h3\u003E\n    \u003Cdiv class=\"mbody\"\u003E\n      \u003Cp\u003EOne HTML file that is the whole app: \u003Cb\u003Eorg-flavored plain-text notes with org-roam-style nodes \u0026amp; backlinks, zero Emacs, instant even at 100k+ lines\u003C/b\u003E — and, TiddlyWiki-style, the app and all your notes live inside the file itself.\u003C/p\u003E\n      \u003Ch4\u003EEditing — one rendered buffer, Emacs/org style\u003C/h4\u003E\n      \u003Cul\u003E\n        \u003Cli\u003EThe whole main area is \u003Cb\u003Eone buffer\u003C/b\u003E: fully rendered (org-modern-style bullets, TODO pills, ☐/☑ checkboxes, timestamps, tags) \u003Ci\u003Eand\u003C/i\u003E the editor — no source/view toggle.\u003C/li\u003E\n        \u003Cli\u003EModal keys: \u003Cspan class=\"kbd\"\u003Ej\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003Ek\u003C/span\u003E down/up · \u003Cspan class=\"kbd\"\u003Eh\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003El\u003C/span\u003E left/right · \u003Cspan class=\"kbd\"\u003Ei\u003C/span\u003E insert at cursor · \u003Cspan class=\"kbd\"\u003Ea\u003C/span\u003E append · \u003Cspan class=\"kbd\"\u003EA\u003C/span\u003E end of line · \u003Cspan class=\"kbd\"\u003Eo\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003EO\u003C/span\u003E new line below/above · \u003Cspan class=\"kbd\"\u003EEsc\u003C/span\u003E back to normal.\u003C/li\u003E\n        \u003Cli\u003EIn insert mode: \u003Cspan class=\"kbd\"\u003EEnter\u003C/span\u003E keeps the same level \u0026amp; item (splits at the cursor; on a heading the rest becomes a same-level heading, at the end of a heading it indents a body line under it; on a list item it continues the list) · \u003Cspan class=\"kbd\"\u003EShift+Enter\u003C/span\u003E places the same item one indent deeper · \u003Cspan class=\"kbd\"\u003ECtrl+Enter\u003C/span\u003E inserts a heading one level deeper than the current one · \u003Cspan class=\"kbd\"\u003ECtrl+Shift+Enter\u003C/span\u003E inserts a heading at the level of the most previous heading · \u003Cspan class=\"kbd\"\u003ETab\u003C/span\u003E inserts indentation · \u003Cspan class=\"kbd\"\u003ECtrl+\u0026gt;\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003ECtrl+\u0026lt;\u003C/span\u003E indent/dedent the current line (CAPS-as-Ctrl friendly) · \u003Cspan class=\"kbd\"\u003EBackspace\u003C/span\u003E at line start joins lines · arrows move across lines. Typing edits the \u003Ci\u003Eraw\u003C/i\u003E org text, and the pretty view re-renders \u003Cb\u003Elive as you type\u003C/b\u003E — close a \u003Ccode\u003E*bold*\u003C/code\u003E and it turns bold, type a heading and its TODO pill and tags appear immediately. Headings can nest to \u003Cb\u003Eany\u003C/b\u003E depth — \u003Ccode\u003E****** …\u003C/code\u003E works, there is no three-level limit\u003C/li\u003E\n        \u003Cli\u003E\u003Cspan class=\"kbd\"\u003ETab\u003C/span\u003E cycles fold (open → children → folded) · \u003Cspan class=\"kbd\"\u003ES-Tab\u003C/span\u003E fold all · \u003Cspan class=\"kbd\"\u003Et\u003C/span\u003E cycle TODO state · \u003Cspan class=\"kbd\"\u003Espace\u003C/span\u003E toggle checkbox · \u003Cspan class=\"kbd\"\u003Ex\u003C/span\u003E delete char · \u003Cspan class=\"kbd\"\u003Eu\u003C/span\u003E undo.\u003C/li\u003E\u003Cli\u003EPlain lists render org-modern style too: \u003Ccode\u003E-\u003C/code\u003E and \u003Ccode\u003E+\u003C/code\u003E become • bullets, \u003Ccode\u003E1.\u003C/code\u003E numbered items get accent-colored numbers — raw text underneath stays untouched\n        \u003Cli\u003E\u003Cspan class=\"kbd\"\u003ECtrl+\u0026gt;\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003ECtrl+\u0026lt;\u003C/span\u003E in normal mode \u003Cb\u003Edemote/promote the whole subtree\u003C/b\u003E under the cursor (org-metaright / org-metaleft) · \u003Cspan class=\"kbd\"\u003E0\u003C/span\u003E \u003Cspan class=\"kbd\"\u003E^\u003C/span\u003E \u003Cspan class=\"kbd\"\u003E$\u003C/span\u003E line edges · \u003Cspan class=\"kbd\"\u003Egg\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003EG\u003C/span\u003E top/bottom · \u003Cspan class=\"kbd\"\u003ECtrl-f/b\u003C/span\u003E pages · \u003Cspan class=\"kbd\"\u003E/\u003C/span\u003E search buffer · \u003Cspan class=\"kbd\"\u003En\u003C/span\u003E/\u003Cspan class=\"kbd\"\u003EN\u003C/span\u003E next/prev match · \u003Cspan class=\"kbd\"\u003ER\u003C/span\u003E refile subtree · \u003Cspan class=\"kbd\"\u003Ez\u003C/span\u003E toggle preview pane\u003C/li\u003E\n      \u003C/ul\u003E\n      \u003Ch4\u003ESaving (TiddlyWiki-style)\u003C/h4\u003E\n      \u003Cul\u003E\n        \u003Cli\u003E\u003Cb\u003E💾 Save / Ctrl+S\u003C/b\u003E — writes everything into the HTML file. Chrome/Edge: pick the file once, then saves go in place. Firefox/Safari: an updated copy downloads — replace your old file with it.\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003ECrash recovery\u003C/b\u003E — while you work, unsaved changes are mirrored to browser storage and restored automatically if you reopen without saving.\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003EPortability\u003C/b\u003E — \u003Cb\u003ELoad .org\u003C/b\u003E / \u003Cb\u003ESave .org\u003C/b\u003E export individual notes as plain text, so no file is ever hostage to this app.\u003C/li\u003E\n      \u003C/ul\u003E\n      \u003Ch4\u003ETry it\u003C/h4\u003E\n      \u003Cul\u003E\n        \u003Cli\u003E\u003Cb\u003EFold / unfold\u003C/b\u003E — put the cursor on a heading and press \u003Cspan class=\"kbd\"\u003ETab\u003C/span\u003E to cycle open → children-only → folded (works even on the 100k-line stress file — rendering is virtualized).\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003ERefile a subtree\u003C/b\u003E — \u003Cspan class=\"kbd\"\u003ER\u003C/span\u003E (or ⤵ Refile). Move a whole subtree to another file or heading. The \u003Ccode\u003E:ID:\u003C/code\u003E travels with it, so backlinks keep working.\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003EPreview pane\u003C/b\u003E — shows the whole subtree under the cursor, narrowed like org: every subheading with the text under it, refreshing as the cursor moves (click a subheading to jump; click a checkbox to toggle). \u003Cb\u003EDrag the divider\u003C/b\u003E to resize it, or \u003Cspan class=\"kbd\"\u003Ez\u003C/span\u003E to hide it.\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003EBacklinks\u003C/b\u003E — the tab shows linked references (\u003Ccode\u003E[[id:…]]\u003C/code\u003E) and unlinked mentions of the selected heading.\u003C/li\u003E\u003Cli\u003E\u003Cb\u003EGraph\u003C/b\u003E — nodes \u0026amp; edges derived from the link index\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003EThemes\u003C/b\u003E — instant, CSS-variable-driven. UTF-8 headings/tags just work.\u003C/li\u003E\n        \u003Cli\u003E\u003Cb\u003E⚡ Stress 100k\u003C/b\u003E — generates a 100,000-line file and shows the parse time.\u003C/li\u003E\n      \u003C/ul\u003E\n      \u003Ch4\u003EHow the single file works\u003C/h4\u003E\n      \u003Cul\u003E\n        \u003Cli\u003EEverything — markup, CSS, app code and your notes — is stored as JSON in a hidden \u003Ccode\u003E\u0026lt;script\u0026gt;\u003C/code\u003E \"store\" inside the file, and a tiny boot script renders it (the same architecture as TiddlyWiki).\u003C/li\u003E\n        \u003Cli\u003EAll \u003Ccode\u003E\u0026lt;\u003C/code\u003E, \u003Ccode\u003E\u0026gt;\u003C/code\u003E and \u003Ccode\u003E\u0026amp;\u003C/code\u003E in the store are escaped, so the file survives any HTML round-trip without corruption.\u003C/li\u003E\n        \u003Cli\u003EA Tauri 2 shell (Rust, ~10 MB binary) can host this same file later for a windowed app that saves in place on disk — same file, no changes.\u003C/li\u003E\n      \u003C/ul\u003E\n      \u003Cp style=\"margin-top:10px;font-size:12px;color:var(--muted)\"\u003ENotes: in the sandboxed preview, save/download/clipboard may be blocked — open the HTML file directly in your browser for full behavior.\u003C/p\u003E\n    \u003C/div\u003E\n    \u003Cdiv class=\"mfoot\"\u003E\u003Cbutton class=\"hbtn primary\" id=\"helpClose\"\u003EGot it\u003C/button\u003E\u003C/div\u003E\n  \u003C/div\u003E\n\u003C/div\u003E\n\n\u003Cdiv id=\"toastHost\"\u003E\u003C/div\u003E\n\n\u003C!-- ============ NEW FILE MODAL ============ --\u003E\n\u003Cdiv class=\"overlay\" id=\"newfileModal\"\u003E\n  \u003Cdiv class=\"modal\" style=\"width:380px\"\u003E\n    \u003Ch3\u003E＋ New .org file\u003C/h3\u003E\n    \u003Cdiv class=\"mbody\"\u003E\n      \u003Cdiv class=\"mrow\"\u003E\u003Clabel\u003EFile name\u003C/label\u003E\u003Cinput id=\"nfName\" style=\"width:100%\" spellcheck=\"false\"\u003E\u003C/div\u003E\n    \u003C/div\u003E\n    \u003Cdiv class=\"mfoot\"\u003E\n      \u003Cbutton class=\"hbtn\" id=\"nfCancel\"\u003ECancel\u003C/button\u003E\n      \u003Cbutton class=\"hbtn primary\" id=\"nfCreate\"\u003ECreate\u003C/button\u003E\n    \u003C/div\u003E\n  \u003C/div\u003E\n\u003C/div\u003E\n\n", "css": "\n/* ============ THEMES (CSS variables = instant theme switching) ============ */\n:root[data-theme=\"light\"]{\n  --bg:#f4f6f8; --panel:#ffffff; --panel2:#f8fafc; --fg:#1f2328; --muted:#6e7781;\n  --border:#d9dee3; --accent:#0969da; --accent-soft:#ddf4ff; --on-accent:#fff;\n  --todo:#cf222e; --done:#1a7f37; --next:#9a6700; --wait:#6e7781;\n  --tag-bg:#ddf4ff; --tag-fg:#0969da; --code-bg:#eff1f3; --hl:#fff8c5; --sel:#ddf4ff;\n  --shadow:0 1px 2px rgba(0,0,0,.05); --row-hover:#f0f3f6; --danger:#cf222e;\n  --curbg:rgba(9,105,218,.28);\n  --h1:#0969da; --h2:#8250df; --h3:#1a7f37; --h4:#bf8700; --h5:#cf222e; --h6:#57606a;}\n:root[data-theme=\"dark\"]{\n  --bg:#0d1117; --panel:#161b22; --panel2:#0d1117; --fg:#e6edf3; --muted:#8b949e;\n  --border:#30363d; --accent:#58a6ff; --accent-soft:#1f3a5f; --on-accent:#0d1117;\n  --todo:#f85149; --done:#3fb950; --next:#d29922; --wait:#8b949e;\n  --tag-bg:#1f3a5f; --tag-fg:#58a6ff; --code-bg:#1c2128; --hl:#5a4b00; --sel:#1f3a5f;\n  --shadow:0 1px 2px rgba(0,0,0,.4); --row-hover:#21262d; --danger:#f85149;\n  --curbg:rgba(88,166,255,.30);\n  --h1:#79c0ff; --h2:#d2a8ff; --h3:#7ee787; --h4:#ffa657; --h5:#ff7b72; --h6:#8b949e;}\n:root[data-theme=\"solarized\"]{\n  --bg:#002b36; --panel:#073642; --panel2:#002b36; --fg:#839496; --muted:#586e75;\n  --border:#0a4a57; --accent:#268bd2; --accent-soft:#073e50; --on-accent:#002b36;\n  --todo:#dc322f; --done:#859900; --next:#b58900; --wait:#586e75;\n  --tag-bg:#0a4a57; --tag-fg:#2aa198; --code-bg:#04222b; --hl:#5a3a00; --sel:#073e50;\n  --shadow:0 1px 2px rgba(0,0,0,.4); --row-hover:#0a3a44; --danger:#dc322f;\n  --curbg:rgba(38,139,210,.30);\n  --h1:#268bd2; --h2:#6c71c4; --h3:#859900; --h4:#b58900; --h5:#cb4b16; --h6:#2aa198;}\n:root[data-theme=\"nord\"]{\n  --bg:#2e3440; --panel:#3b4252; --panel2:#2e3440; --fg:#d8dee9; --muted:#8b93a5;\n  --border:#434c5e; --accent:#88c0d0; --accent-soft:#3b4a5c; --on-accent:#2e3440;\n  --todo:#bf616a; --done:#a3be8c; --next:#ebcb8b; --wait:#8b93a5;\n  --tag-bg:#3b4a5c; --tag-fg:#88c0d0; --code-bg:#2a303c; --hl:#6b5a2e; --sel:#3b4a5c;\n  --shadow:0 1px 2px rgba(0,0,0,.35); --row-hover:#414a5c; --danger:#bf616a;\n  --curbg:rgba(136,192,208,.30);\n  --h1:#88c0d0; --h2:#b48ead; --h3:#a3be8c; --h4:#ebcb8b; --h5:#d08770; --h6:#81a1c1;}\n:root[data-theme=\"gruvbox\"]{\n  --bg:#282828; --panel:#3c3836; --panel2:#282828; --fg:#ebdbb2; --muted:#a89984;\n  --border:#504945; --accent:#b8bb26; --accent-soft:#4a4730; --on-accent:#282828;\n  --todo:#fb4934; --done:#b8bb26; --next:#fabd2f; --wait:#a89984;\n  --tag-bg:#4a4730; --tag-fg:#b8bb26; --code-bg:#32302f; --hl:#6b5a2e; --sel:#4a4730;\n  --shadow:0 1px 2px rgba(0,0,0,.4); --row-hover:#45403d; --danger:#fb4934;\n  --curbg:rgba(184,187,38,.30);\n  --h1:#fabd2f; --h2:#d3869b; --h3:#b8bb26; --h4:#83a598; --h5:#fe8019; --h6:#8ec07c;}\n:root[data-theme=\"dracula\"]{\n  --bg:#282a36; --panel:#21222c; --panel2:#282a36; --fg:#f8f8f2; --muted:#6272a4;\n  --border:#44475a; --accent:#bd93f9; --accent-soft:#343746; --on-accent:#282a36;\n  --todo:#ff5555; --done:#50fa7b; --next:#f1fa8c; --wait:#6272a4;\n  --tag-bg:#343746; --tag-fg:#8be9fd; --code-bg:#1e1f29; --hl:#44475a; --sel:#44475a;\n  --shadow:0 1px 2px rgba(0,0,0,.45); --row-hover:#343746; --danger:#ff5555;\n  --curbg:rgba(189,147,249,.30);\n  --h1:#bd93f9; --h2:#ff79c6; --h3:#50fa7b; --h4:#8be9fd; --h5:#ffb86c; --h6:#f1fa8c;}\n:root[data-theme=\"one-dark\"]{\n  --bg:#282c34; --panel:#21252b; --panel2:#282c34; --fg:#abb2bf; --muted:#5c6370;\n  --border:#3e4451; --accent:#61afef; --accent-soft:#2c313c; --on-accent:#282c34;\n  --todo:#e06c75; --done:#98c379; --next:#e5c07b; --wait:#5c6370;\n  --tag-bg:#2c313c; --tag-fg:#56b6c2; --code-bg:#21252b; --hl:#3e4451; --sel:#3e4451;\n  --shadow:0 1px 2px rgba(0,0,0,.4); --row-hover:#2c313c; --danger:#e06c75;\n  --curbg:rgba(97,175,239,.28);\n  --h1:#61afef; --h2:#c678dd; --h3:#98c379; --h4:#e5c07b; --h5:#e06c75; --h6:#56b6c2;}\n:root[data-theme=\"tokyonight\"]{\n  --bg:#1a1b26; --panel:#16161e; --panel2:#1a1b26; --fg:#c0caf5; --muted:#565f89;\n  --border:#292e42; --accent:#7aa2f7; --accent-soft:#24283b; --on-accent:#1a1b26;\n  --todo:#f7768e; --done:#9ece6a; --next:#e0af68; --wait:#565f89;\n  --tag-bg:#24283b; --tag-fg:#7dcfff; --code-bg:#16161e; --hl:#292e42; --sel:#292e42;\n  --shadow:0 1px 2px rgba(0,0,0,.45); --row-hover:#24283b; --danger:#f7768e;\n  --curbg:rgba(122,162,247,.28);\n  --h1:#7aa2f7; --h2:#bb9af7; --h3:#9ece6a; --h4:#e0af68; --h5:#f7768e; --h6:#7dcfff;}\n:root[data-theme=\"monokai\"]{\n  --bg:#272822; --panel:#1e1f1c; --panel2:#272822; --fg:#f8f8f2; --muted:#75715e;\n  --border:#3e3d32; --accent:#66d9ef; --accent-soft:#3e3d32; --on-accent:#272822;\n  --todo:#f92672; --done:#a6e22e; --next:#e6db74; --wait:#75715e;\n  --tag-bg:#3e3d32; --tag-fg:#66d9ef; --code-bg:#1e1f1c; --hl:#49483e; --sel:#49483e;\n  --shadow:0 1px 2px rgba(0,0,0,.45); --row-hover:#3e3d32; --danger:#f92672;\n  --curbg:rgba(102,217,239,.28);\n  --h1:#66d9ef; --h2:#ae81ff; --h3:#a6e22e; --h4:#e6db74; --h5:#f92672; --h6:#fd971f;}\n/* ============ BASE ============ */\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%}\nbody{\n  font-family:\"Segoe UI\",system-ui,-apple-system,\"Helvetica Neue\",Arial,sans-serif;\n  font-size:13.5px;color:var(--fg);background:var(--bg);\n  overflow:hidden;\n}\nbutton{font:inherit;color:inherit;background:none;border:none;cursor:pointer}\nselect,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 8px;outline:none}\nselect:focus,input:focus{border-color:var(--accent)}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid var(--bg)}\n::-webkit-scrollbar-track{background:transparent}\n/* ============ LAYOUT ============ */\n#app{display:grid;grid-template-rows:50px 1fr 26px;height:100vh}\nheader{\n  display:flex;align-items:center;gap:10px;padding:0 14px;\n  background:var(--panel);border-bottom:1px solid var(--border);\n}\n.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.2px}\n.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:800}\n.brand small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:2px}\n.spacer{flex:1}\n.hbtn{padding:5px 11px;border-radius:7px;color:var(--fg);border:1px solid var(--border);background:var(--panel2);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}\n.hbtn:hover{border-color:var(--accent);color:var(--accent)}\n.hbtn:disabled{opacity:.4;cursor:default;border-color:var(--border);color:var(--fg)}\n.hbtn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.hbtn.primary:hover{filter:brightness(1.1);color:var(--on-accent)}\n#main{display:grid;grid-template-columns:300px 1fr;min-height:0}\n/* ============ SIDEBAR ============ */\n#sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);min-height:0}\n.sb-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 6px;gap:2px}\n.sb-tab{padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}\n.sb-tab:hover{color:var(--fg)}\n.sb-tab.active{color:var(--accent);border-bottom-color:var(--accent)}\n.sb-panel{flex:1;overflow-y:auto;padding:8px;min-height:0;display:none}\n.sb-panel.active{display:block}\n.file-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px}\n.file-item:hover{background:var(--row-hover)}\n.file-item.active{background:var(--sel)}\n.file-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.file-item .ln{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n.foot-note{font-size:11px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--border);line-height:1.5}\n.search-row{display:flex;gap:6px;margin-bottom:8px}\n.search-row input{flex:1}\n#searchResults .sr{padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px;margin-bottom:3px}\n#searchResults .sr:hover{background:var(--row-hover)}\n#searchResults .sr .fn{color:var(--accent);font-weight:600}\n#searchResults .sr .ln{color:var(--muted);font-size:11px}\n#searchResults .sr .snip{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\nmark{background:var(--hl);color:var(--fg);border-radius:2px;padding:0 1px}\n.blk-group{margin-bottom:12px}\n.blk-group h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px}\n.blk-group h4 .cnt{background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:0 7px;font-size:10px}\n.blk{display:flex;align-items:baseline;gap:7px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}\n.blk:hover{background:var(--row-hover)}\n.blk .bl{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;min-width:64px}\n.blk .bd{flex:1;min-width:0}\n.blk .bd .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.blk .bd .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.empty-note{color:var(--muted);font-size:12px;padding:10px 8px;line-height:1.5}\n#graphSvg{width:100%;height:400px}\n.graph-legend{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}\n/* ============ MAIN ============ */\n#mainCol{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}\n.main-toolbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border)}\n.main-toolbar .fname{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}\n.mtabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:2px}\n.mtab{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--muted);font-weight:600}\n.mtab.active{background:var(--accent);color:var(--on-accent)}\n.tb-spacer{flex:1}\n#contentWrap{display:grid;grid-template-columns:1fr 6px 0px;min-height:0;min-width:0}\n#contentWrap.focus{grid-template-columns:1fr 6px 360px}\n#paneHandle{width:6px;cursor:col-resize;background:transparent;transition:background .15s}\n#paneHandle:hover,#paneHandle.dragging{background:var(--accent);opacity:.55}\n#outlinePanel{display:flex;flex-direction:column;min-height:0;min-width:0}\n#outlineViewport{flex:1;overflow-y:auto;position:relative;min-height:0}\n#outlineRows{position:relative}\n.orow{position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;gap:5px;padding-right:8px;cursor:pointer;border-radius:0;white-space:nowrap;user-select:none}\n.orow:hover{background:var(--row-hover)}\n.orow.sel{background:var(--sel)}\n.orow .chev{width:18px;text-align:center;color:var(--muted);font-size:10px;flex:none}\n.orow .chev:hover{color:var(--accent)}\n.orow .kw{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;flex:none}\n.kw{font-size:10.5px;letter-spacing:.3px}\n.kw.TODO{color:var(--todo);background:color-mix(in srgb,var(--todo) 16%,transparent)}\n.kw.DONE{color:var(--done);background:color-mix(in srgb,var(--done) 16%,transparent);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--done) 55%,transparent)}\n.kw.NEXT,.kw.STRT,.kw.PROJ,.k ent(){\n  const L = [];\n  L.push('#+TITLE: Stress Test — 100,000 lines');\n  L.push('#+FILETAGS: :bench:');\n  L.push('');\n  const tags = [':work:',':home:',':research:',':notes:'];\n  const names = ['alpha','beta','gamma','delta'];\n  for (let t = 1; t \u003C= 1000; t++){\n    L.push('* Area ' + t + tags[t % 4] + (t % 7 === 0 ? ':urgent:' : ''));\n    for (let s = 1; s \u003C= 99; s++){\n      const lvl = 2 + (s % 2);\n      let title = 'Task ' + t + '.' + s + ' ' + names[s % 4];\n      if (s % 10 === 0) title = 'TODO ' + title;\n      if (s % 37 === 0) title = 'Задача ' + t + '.' + s + ' — ' + title;\n      if (s % 53 === 0) title = '任務 ' + t + '.' + s + ' ' + title;\n      L.push('*'.repeat(lvl) + ' ' + title);\n      if (s % 25 === 0) L.push('  SCHEDULED: \u003C2026-08-24 Mon\u003E');\n      if (s % 30 === 0){\n        L.push('  :PROPERTIES:'); L.push('  :ID: task-' + t + '-' + s); L.push('  :END:');\n      }\n      if (s % 40 === 0) L.push('  - [ ] subtask with [[id:note-big-picture][link to big picture]]');\n      if (s === 50) L.push('  See also [[id:note-tauri][Tauri]] and [[org-in-2026]].');\n    }\n  }\n  return L.join('\\n');\n}\n\n/* =====================================================================\n   Demo knowledge base (org-roam-flavored samples, cross-linked)\n   ===================================================================== */\nfunction seedFiles(){\n  return [\n    {name:'notes.org', content:\n      '#+TITLE: Notes\\n\\n* Welcome\\nWrite org-flavored notes here.\\n- [ ] a task to try checkbox toggling\\n- [ ] refile this file\\'s heading into another file\\n'}\n  ];\n}\n/* =====================================================================\n   UI layer\n   ===================================================================== */\nconst $ = id =\u003E document.getElementById(id);\nconst state = {\n  files: [],            // {name, content, parsed}\n  current: 0,\n  folds: {},            // \"file::key\" -\u003E 0 open | 1 children-only | 2 folded\n  sel: null,            // {fileIdx, key}\n  index: null,\n  rows: [],\n  rendered: {i0:0, i1:0},\n  dirty: false,\n  fsaHandle: null,\n  cur: {vi:0, col:0, mode:'normal'}, // cursor: visible row index, column, mode\n  prevCurVi: null,             // last row that carried the block caret (cleared on move)\n  visRows: [],          // [{no, h, foldMark, hidden}]\n  rowCache: [],         // segs per painted row (for column mapping)\n  il: null,             // active insert-mode element\n  bufActive: true,\n  undo: [],             // {label, items:[{f, prev}]}\n  searchQ: '',\n  gg: false,\n  pan: null,\n};\nconst ROWH = 26, BUFFER = 30;\n\nconst storage = () =\u003E { try { return window.localStorage; } catch(e){ return null; } };\nfunction setDirty(d){\n  state.dirty = d;\n  const el = $('stSaved');\n  if (el){ el.textContent = d ? '● unsaved changes' : '💾 saved'; el.classList.toggle('dirty', d); }\n}\n/* localStorage = crash recovery for unsaved changes. The embedded store in the\n   HTML file itself is the source of truth; on successful save we clear this. */\nfunction persist(){\n  const s = storage(); if (!s) return;\n  try {\n    const small = state.files.filter(f =\u003E f.content.length \u003C 400000);\n    s.setItem('orglite.v2', JSON.stringify({\n      files: small.map(f =\u003E ({name: f.name, content: f.content})),\n      savedAt: Date.now()\n    }));\n  } catch(e){ /* quota — skip silently */ }\n  setDirty(true);\n}\nfunction clearPersisted(){\n  const s = storage(); if (!s) return;\n  try { s.removeItem('orglite.v2'); s.removeItem('orglite.files.v1'); } catch(e){}\n}\nfunction loadPersisted(){\n  const s = storage(); if (!s) return null;\n  try {\n    const raw = s.getItem('orglite.v2');\n    if (!raw) return null;\n    const o = JSON.parse(raw);\n    return (o \u0026\u0026 Array.isArray(o.files)) ? o : null;\n  } catch(e){ return null; }\n}\n\nfunction toast(msg, opts){\n  opts = opts || {};\n  const host = $('toastHost');\n  const el = document.createElement('div');\n  el.className = 'toast';\n  el.innerHTML = '\u003Cspan\u003E' + esc(msg) + '\u003C/span\u003E';\n  if (opts.action){\n    const b = document.createElement('button');\n    b.className = 'act';\n    b.textContent = opts.action.label;\n    b.onclick = () =\u003E { opts.action.fn(); el.remove(); };\n    el.appendChild(b);\n  }\n  host.appendChild(el);\n  setTimeout(() =\u003E { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() =\u003E el.remove(), 320); }, opts.ms || 3800);\n}\n\nfunction reparseAll(){\n  for (const f of state.files) f.parsed = parseOrg(f.content);\n  state.index = buildIndex(state.files);\n}\nfunction currentFile(){ return state.files[state.current]; }\n\n/* ---------- undo ---------- */\nfunction pushUndo(label, items, focusFile){\n  state.undo.push({label, items: items.map(x =\u003E ({f: x.f, prev: x.prev})), focusFile: focusFile || null});\n  if (state.undo.length \u003E 100) state.undo.shift();\n  updateUndoBtn();\n}\nfunction doUndo(){\n  const u = state.undo.pop();\n  if (!u){ toast('Nothing to undo'); return; }\n  for (const it of u.items) it.f.content = it.prev;\n  reparseAll();\n  if (u.focusFile \u0026\u0026 state.files.includes(u.focusFile)) openFile(state.files.indexOf(u.focusFile));\n  renderAll();\n  const f = currentFile();\n  if (state.sel \u0026\u0026 state.sel.fileIdx === state.current){\n    const h = findHeading(f, state.sel.key);\n    if (h) selectHeading(f, h);\n  }\n  toast('Undid: ' + u.label);\n  persist();\n  updateUndoBtn();\n}\nfunction updateUndoBtn(){\n  const b = $('btnUndo');\n  if (b){ b.disabled = state.undo.length === 0; b.title = state.undo.length ? 'Undo (' + state.undo.length + ')' : 'Nothing to undo'; }\n}\n\n/* ---------- pane markup rendering ---------- */\nfunction renderInline(text){\n  let t = esc(text);\n  t = t.replace(/\\*([^*\\n]+)\\*/g, '\u003Cb\u003E$1\u003C/b\u003E');\n  t = t.replace(/\\/([^\\/\\n]+)\\//g, '\u003Ci\u003E$1\u003C/i\u003E');\n  t = t (1) + 'px\"\u003E' + esc(raw) + '\u003C/span\u003E',\n          raw: raw, w: raw.length * charWidth()};\n}\nfunction findClose(raw, start, ch){\n  for (let i = start; i \u003C raw.length; i++){\n    if (raw[i] === '\\\\'){ i++; continue; }\n    // closing marker: same char, not doubled, preceded by non-whitespace\n    // (org: '*bold* and' is valid; '*foo *' is not)\n    if (raw[i] === ch \u0026\u0026 raw[i+1] !== ch \u0026\u0026 i \u003E 0 \u0026\u0026 raw[i-1] !== ' ' \u0026\u0026 raw[i-1] !== '\\t') return i;\n  }\n  return -1;\n}\n/* Scan raw text into segments; hidden markers become .mk spans, styled\n   content stays visible. Raw characters are preserved 1:1 across segments. */\nfunction scanPretty(raw){\n  const segs = [];\n  const W = charWidth();\n  const text = t =\u003E { if (t) segs.push({html: esc(t), raw: t, w: t.length * W}); };\n  let i = 0, n = raw.length, buf = '';\n  const flush = () =\u003E { text(buf); buf = ''; };\n  while (i \u003C n){\n    const c = raw[i], next = raw[i+1];\n    if (c === '\\\\'){ buf += (i + 1 \u003C n) ? raw[i+1] : ''; i += 2; continue; }\n    // bold *x*\n    if (c === '*' \u0026\u0026 next \u0026\u0026 next !== '*' \u0026\u0026 next !== ' '){\n      const j = findClose(raw, i+1, '*');\n      if (j \u003E i + 1){\n        flush();\n        segs.push(mkSeg('*', 'mb'));\n        const inner = scanPretty(raw.slice(i+1, j));\n        segs.push({html:'\u003Cb\u003E', raw:'', w:0});\n        for (const s of inner) segs.push(s);\n        segs.push({html:'\u003C/b\u003E', raw:'', w:0});\n        segs.push(mkSeg('*', 'mb'));\n        i = j + 1; continue;\n      }\n    }\n    // italic /x/\n    if (c === '/' \u0026\u0026 next \u0026\u0026 next !== '/' \u0026\u0026 next !== ' '){\n      const j = findClose(raw, i+1, '/');\n      if (j \u003E i + 1){\n        flush();\n        segs.push(mkSeg('/', 'mi'));\n        const inner = scanPretty(raw.slice(i+1, j));\n        segs.push({html:'\u003Ci\u003E', raw:'', w:0});\n        for (const ee') + ' “' + h.title + '”', [{f, prev}]);\n  reparseAll();\n  persist();\n  renderAll();\n  const hh = f.parsed.headings.find(x =\u003E x.startLine === h.startLine);\n  if (hh) setCursor(viForLine(hh.startLine), 0);\n  toast((delta \u003E 0 ? 'Demoted' : 'Promoted') + ' “' + h.title + '” (' + h.level + ' → ' + Math.max(1, h.level + delta) + ')');\n}\n\nfunction refileAtCursor(){\n  const f = currentFile();\n  const h = headingAtCursor();\n  if (!h){ toast('Cursor is not on a heading.'); return; }\n  if (state.files.length \u003C 2){ toast('Need at least one other file to refile into.'); return; }\n  selectHeading(f, h);\n  openRefileModal(f, h);\n}\nfunction toggleFocusPane(){\n  const w = $('contentWrap');\n  if (w.classList.contains('focus')){\n    w.classList.remove('focus');\n    w.style.gridTemplateColumns = '';\n  } else {\n    w.classList.add('focus');\n    w.style.gridTemplateColumns = '1fr 6px ' + (state.paneW || 360) + 'px';\n  }\n}\nfunction applyPaneWidth(px){\n  state.paneW = px;\n  const w = $('contentWrap');\n  w.classList.add('focus');\n  w.style.gridTemplateColumns = '1fr 6px ' + Math.round(px) + 'px';\n}\n\n/* ---------- selection \u0026 focus pane ---------- */\nfunction selectHeading(f, h){\n  state.sel = {fileIdx: state.files.indexOf(f), key: h.key};\n  renderFocusPane(f, h);\n}\nfunction findHeading(f, key){\n  for (const h of f.parsed.headings) if (h.key === key) return h;\n  return null;\n}\nfunction crumbs(h){\n  const parts = [];\n  let cur = h;\n  while (cur \u0026\u0026 cur.parent){ parts.unshift(cur.title); cur = cur.parent; }\n  return parts;\n}\n\nfunction renderFocusPane(f, h){\n  const crumb = $('fpCrumb');\n  crumb.innerHTML = crumbs(h).map((t,i,a) =\u003E\n    i === a.length-1 ? '\u003Cb\u003E' + esc(t) + '\u003C/b\u003E' : esc(t) + '\u003Cspan class=\"sep\"\u003E›\u003C/span\u003E').join('');\n  crumb.prepend(esc(f.name) + ' \u003Cspan class=\"sep\"\u003E›\u003C/span\u003E ');\n  $('fpTitle').innerHTML = (h.todo ? '\u003Cspan cla r (const e of edges){\n      const fa = nodes.get(e.a).f.name, fb = nodes.get(e.b).f.name;\n      if (fa !== fb) fEdges.add([fa, fb].sort().join('|'));\n    }\n    drawGraph(svg, [...fNodes.entries()].map(([k,v]) =\u003E ({k, name:v.name, deg:v.deg})),\n      [...fEdges].map(s =\u003E { const p = s.split('|'); return {a:p[0], b:p[1]}; }), true);\n    return;\n  }\n  drawGraph(svg, [...nodes.entries()].map(([k,v]) =\u003E ({k, f:v.f, h:v.h, name:v.h.title, deg:v.deg})),\n    edges, false);\n}\nfunction drawGraph(svg, nodes, edges, fileMode){\n  const W = 300, H = 400, cx = W/2, cy = H/2;\n  const colors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39c5cf','#ffa657','#a5d6ff'];\n  const byFile = {};\n  nodes.forEach(n =\u003E { const fn = fileMode ? n.name : n.f.name; (byFile[fn] = byFile[fn] || []).push(n); });\n  const files = Object.keys(byFile);\n  files.forEach((fn, fi) =\u003E {\n    const list = byFile[fn];\n    const base = (fi / files.length) * Math.PI * 2;\n    const step = 0.9 / Math.max(1, list.length - 1);\n    list.forEach((n, i) =\u003E {\n      const ang = base + (i - (list.length - 1) / 2) * step;\n      n.x = cx + Math.cos(ang) * (Math.min(H, W) / 2 - 30);\n      n.y = cy + Math.sin(ang) * (Math.min(H, W) / 2 - 30);\n      n.color = colors[fi % colors.length];\n    });\n  });\n  let html = '';\n  for (const e of edges){\n    const a = nodes.find(n =\u003E n.k === e.a), b = nodes.find(n =\u003E n.k === e.b);\n    if (!a || !b) continue;\n    html += '\u003Cline x1=\"' + a.x.toFixed(1) + '\" y1=\"' + a.y.toFixed(1) + '\" x2=\"' + b.x.toFixed(1) + '\" y2=\"' + b.y.toFixed(1) +\n            '\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\"0.7\"/\u003E';\n  }\n  for (const n of nodes){\n    const r = fileMode ? Math.min(14, 4 + Math.log2(n.deg + 2) * 3) : Math.min(9, 3 + Math.log2(n.deg + 2) * 2);\n    html += '\u003Cg class=\"gnode\" data-idx=\"' + nodes.indexOf(n) + '\"\u003E' +\n            '\u003Ccircle cx=\"' + n.x.toFixed(1) + '\" ====================================================== */\nfunction buildSavedHtml(){\n  const data = {\n    v: 2,\n    savedAt: new Date().toISOString(),\n    title: document.title,\n    markup: window.__ORGLITE__.markup,\n    css: window.__ORGLITE__.css,\n    app: window.__ORGLITE__.app,\n    files: state.files.map(f =\u003E ({name: f.name, content: f.content}))\n  };\n  const json = JSON.stringify(data)\n    .replace(/\u003C/g, () =\u003E '\\\\u003C')\n    .replace(/\u003E/g, () =\u003E '\\\\u003E')\n    .replace(/\u0026/g, () =\u003E '\\\\u0026');\n  const head = window.__ORGLITE_HEAD__ ||\n    ('\u003C!DOCTYPE html\u003E\\n' + document.documentElement.outerHTML.split('\u003C!--ORGLITE-STORE--\u003E')[0]);\n  const tail = window.__ORGLITE_TAIL__ || '\u003C/body\u003E\u003C/html\u003E';\n  return head + '\u003C!--ORGLITE-STORE--\u003E' +\n    '\u003Cscript id=\"orglite-store\" type=\"application/json\"\u003E' + json + '\u003C/script\u003E' + tail;\n}\n\nfunction downloadSavedCopy(htmlStr){\n  const blob = new Blob([htmlStr], {type: 'text/html;charset=utf-8'});\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'orglite.html';\n  document.body.appendChild(a);\n  a.click();\n  setTimeout(() =\u003E { URL.revokeObjectURL(a.href); a.remove(); }, 400);\n  clearPersisted();\n  setDirty(false);\n  toast('Downloaded updated copy — replace your orglite.html with this file to keep your changes.');\n}\n\nasync function saveToFile(){\n  let htmlStr;\n  try { htmlStr = buildSavedHtml(); }\n  catch(e){ toast('Could not build the save file: ' + e.message); return; }\n  if (window.showSaveFilePicker){\n    try {\n      if (!state.fsaHandle){\n        let suggested = 'orglite.html';\n        try { const p = location.pathname.split('/').pop(); if (p \u0026\u0026 /\\.html?$/i.test(p)) suggested = p; } catch(e){}\n        state.fsaHandle = await window.showSaveFilePicker({\n          suggestedName: suggested,\n          types: [{descript

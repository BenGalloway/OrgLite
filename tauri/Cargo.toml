[package]
name = "orglite"
version = "0.1.0"
description = "OrgLite — org-flavored notes without Emacs"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used for production builds when no dev server is specified — DO NOT REMOVE
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
